<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premio Especial</title>
<style>
:root{--bg:#f5f2e8;--ink:#151515;--green:#1f6b4f;--gold:#c99b2e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#fff 0,#f5f2e8 55%,#e9e2d0 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);padding:24px}
.card{width:min(720px,100%);background:#fff;border:2px solid var(--green);border-radius:28px;padding:34px 28px 30px;text-align:center;box-shadow:0 18px 55px rgba(0,0,0,.14);position:relative;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:10px;border:1px solid #d8d8d8;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;background:#fafafa}
.cross{width:24px;height:24px;position:relative;display:inline-block}
.cross:before,.cross:after{content:"";position:absolute;background:var(--green);border-radius:2px}
.cross:before{width:8px;height:24px;left:8px;top:0}
.cross:after{width:24px;height:8px;left:0;top:8px}
h1{font-size:clamp(34px,7vw,68px);line-height:.95;margin:26px 0 14px;color:var(--green);letter-spacing:-.04em}
.sub{font-size:clamp(18px,4.6vw,28px);line-height:1.25;font-weight:800;margin:0 auto;max-width:620px}
.highlight{color:#8a2b17}
.rule{height:1px;background:#e7e2d6;margin:26px 0}
.small{font-size:15px;line-height:1.45;color:#5d5d5d;margin:0}
.stamp{margin:22px auto 0;width:126px;height:126px;border:4px double #c62828;border-radius:50%;display:grid;place-items:center;transform:rotate(-7deg);color:#c62828;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:13px;padding:15px}
.confetti{position:absolute;inset:0;pointer-events:none;opacity:.4;background-image:radial-gradient(circle at 10% 12%,#c99b2e 0 3px,transparent 4px),radial-gradient(circle at 88% 18%,#1f6b4f 0 3px,transparent 4px),radial-gradient(circle at 80% 82%,#8a2b17 0 3px,transparent 4px),radial-gradient(circle at 15% 78%,#1f6b4f 0 3px,transparent 4px)}
</style>
</head>
<body>
<main class="card">
<div class="confetti"></div>
<div class="badge"><span class="cross" aria-hidden="true"></span> Farmacia · Beneficio exclusivo</div>
<h1>PREMIO<br>ESPECIAL</h1>
<p class="sub">RECLAMA TU <span class="highlight">TRAGO MEDICINAL</span><br>POR BORRACHO CERTIFICADO<br>Y MIEMBRO OFICIAL DE LA FARMACIA.</p>
<div class="stamp">Premio válido<br>solo para el viernes</div>
<div class="rule"></div>
<p class="small">Presenta esta pantalla para reclamar tu “tratamiento”.<br><strong>Uso recreativo. Cero validez médica. 😄</strong></p>
</main>
</body>
</html>
